name: single-spa-angular

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          # Default cache directory for Cypress
          path: ~/.cache
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Build integration apps
        run: pnpm build:all

      - name: Run end-to-end tests via Cypress
        env:
          NO_UPDATE_CHECK: 1
        run: pnpm test:ci:integration

      - name: Run Jest
        run: pnpm test:ci
